[build-system]
requires = ["setuptools>=77", "setuptools-rust>=1.11"]
build-backend = "setuptools.build_meta"

[project]
name = "inference-engine-teardown"
version = "0.2.0"
description = "Replay reproducible streaming inference workloads"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"

[[tool.setuptools-rust.bins]]
target = "inference-engine-teardown"
args = ["--locked"]

[tool.setuptools]
packages = ["inference_teardown"]

[tool.setuptools.package-data]
inference_teardown = ["workload.jsonl"]
